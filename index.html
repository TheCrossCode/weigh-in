<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0d">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Weigh-In">
  <title>Weigh-In</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section id="view-log" class="view active">
      <header class="top">
        <h1 id="today-label"></h1>
        <span class="top-actions">
        <button class="icon-btn" data-act="share-all" aria-label="Share progress" hidden>
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 7.5L12 3l4.5 4.5"/><path d="M8 11H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-2"/></svg>
        </button>
        <button class="icon-btn" data-act="settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        </button>
        </span>
      </header>
      <div class="hero" id="hero"></div>
      <div class="tiles" id="tiles"></div>
      <div class="chart-card" id="chart-card" hidden>
        <div class="seg seg-sm" id="range-seg"><button data-v="week">Week</button><button data-v="month">Month</button><button data-v="year">Year</button></div>
        <div class="chart-head">
          <button class="nav" data-act="chart-prev" aria-label="Previous period">‹</button>
          <div class="chart-title"><span id="chart-label"></span><span id="chart-chip"></span></div>
          <button class="nav" data-act="chart-next" aria-label="Next period">›</button>
        </div>
        <div class="chart" id="chart"></div>
      </div>
      <h2 class="section-title" id="history-title">History</h2>
      <ul class="list" id="history"></ul>
    </section>

    <section id="view-programs" class="view">
      <header class="top"><h1>Programs</h1></header>
      <div id="program-active"></div>
      <h2 class="section-title" id="past-title">Past</h2>
      <ul class="list" id="program-past"></ul>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="log">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M7.5 11a5 5 0 0 1 9 0"/><path d="M12 12l1.8-2.6"/></svg>
      <span>Log</span>
    </button>
    <button class="fab" data-act="log" aria-label="Log weight">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tab" data-view="programs">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
      <span>Programs</span>
    </button>
  </nav>

  <div class="pick-bar">
    <button class="link" data-act="pick-cancel">Cancel</button>
    <div class="sheet-title" id="pick-title"></div>
    <span></span>
  </div>

  <div class="backdrop" data-act="close"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="viewer" id="viewer"></div>
  <input type="file" id="file-input" accept="image/*" multiple hidden>
  <input type="file" id="import-input" accept="application/json,.json" hidden>

  <script type="module" src="app.js"></script>
</body>
</html>
